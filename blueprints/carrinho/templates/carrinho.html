<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>carrinho</h1>
    {% for c in carrinho %}
        <p>{{c.nome}}</p>
        <p>{{c.preco}}</p>
        <form method="post" action="/carrinho/remover/{{ c.id }}">
            <button type="submit">remover</button>
      </form>
      <form method="post" action="/compra/comprar/{{ c.id }}">
            <button type="submit">comprar</button>
      </form>
    {% else %}
    <p>carrinho vazio</p>
    {% endfor %}
    
</body>
</html>
