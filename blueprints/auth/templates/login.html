{% extends 'base.html' %}

{% block title %}Entrar{% endblock %}

{% block content %}
<section class="container auth-wrap">
  <div class="card auth-card">
    <h1>Entrar</h1>
    <p class="sub">Acesse sua conta para usar o carrinho e ver suas compras.</p>

    <form method="post" action="{{ url_for('auth.login') }}">
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-azul btn-block">Entrar</button>
    </form>

    <p class="auth-rodape">Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Criar conta</a></p>
  </div>
</section>
{% endblock %}
