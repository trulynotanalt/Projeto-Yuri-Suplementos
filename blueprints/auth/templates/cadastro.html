{% extends 'base.html' %}

{% block title %}Criar conta{% endblock %}

{% block content %}
<section class="container auth-wrap">
  <div class="card auth-card">
    <h1>Criar conta</h1>
    <p class="sub">Cadastre-se para usar o carrinho e acompanhar suas compras.</p>

    <form method="post" action="{{ url_for('auth.cadastro') }}">
      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" required maxlength="60" autocomplete="name">
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required maxlength="90" autocomplete="email">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-azul btn-block">Criar conta</button>
    </form>

    <p class="auth-rodape">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
  </div>
</section>
{% endblock %}
