{% extends 'base.html' %}

{% block title %}Excluir conta{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
{% endblock %}

{% block content %}
<section class="container auth-wrap">
  <div class="card auth-card auth-card-perigo">
    <h1>Deseja realmente excluir sua conta?</h1>

    <form action="#" method="get" >
      <button class="btn btn-contorno" type="submit" formaction="{{url_for('user.perfil')}}" formmethod="GET" > Cancelar</button>
      <button class="btn btn-excluir" type="submit" formaction="{{url_for('user.excluir')}}" formmethod="POST"> Excluir Conta</button>
    </form>
  </div>
</section>
{% endblock %}
